name: "test_data"
symbol: "BTCUSDT"
strategy_type: "test"  # Test mode - no trading, just data reception

# Timeframes for analysis
timeframes:
  - "15m"  # Primary entry/exit timeframe
  - "1h"   # Trend confirmation

# =============================================================================
# INDICATORS
# =============================================================================
indicators:
  # RSI for momentum confirmation
  rsi_15m:
    type: "rsi"
    timeframe: "15m"
    period: 14
    oversold: 30
    overbought: 70
    description: "RSI momentum indicator on 15-minute chart"
  
  # EMA for trend confirmation
  ema_fast:
    type: "ema"
    timeframe: "15m"
    period: 9
    description: "Fast EMA for trend"
  
  ema_slow:
    type: "ema"
    timeframe: "15m"
    period: 21
    description: "Slow EMA for trend"
  
  # Hourly RSI for higher timeframe confirmation
  rsi_1h:
    type: "rsi"
    timeframe: "1h"
    period: 14
    description: "RSI on 1-hour chart for trend confirmation"

# =============================================================================
# TEST MODE NOTES
# =============================================================================
# This is a test strategy that:
# 1. Connects to Bybit API
# 2. Subscribes to market data for BTCUSDT
# 3. Calculates the specified indicators
# 4. Logs data reception and indicator values
# 5. Does NOT generate any trading signals
# 6. Does NOT place any orders
#
# Use this to verify:
# - API connectivity is working
# - Market data is being received
# - Indicators are calculating correctly
# - Data flow through the system is functioning
#
# Check the logs for "test_strategy_data_received" messages to see:
# - Current price
# - Volume
# - Timestamp
# - All calculated indicator values
# =============================================================================
